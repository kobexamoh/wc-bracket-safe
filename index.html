<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 WC Bracket Predictor - Work Safe Edition</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
    <header>
        <h1>⚽ 2026 World Cup Bracket Predictor</h1>
        <p>Predict the tournament winner and share with your team</p>
    </header>

    <main class="container">
        <!-- Messages (top of viewport so save success/errors are visible without scrolling) -->
        <div id="alerts"></div>

        <!-- Auth Section -->
        <div id="authSection">
            <div class="alert info">
                <strong>Sign in to save your bracket</strong>
            </div>
            <form id="loginForm">
                <div style="margin-bottom: 15px;">
                    <input 
                        type="email" 
                        id="emailInput" 
                        placeholder="your@email.com" 
                        required
                        style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px;"
                    >
                </div>
                <button id="loginBtn" type="submit" class="btn">Sign In with Email</button>
            </form>
        </div>

        <!-- Bracket Section -->
        <div id="bracketSection" style="display: none;">
            <div class="bracket-topbar">
                <div id="userInfo" class="user-info"></div>
                <button id="logoutBtn" type="button" class="btn btn-ghost">Sign Out</button>
            </div>

            <div class="bracket-toolbar">
                <div class="bracket-progress">
                    <span id="progressText" class="progress-text">0 / 12 groups set</span>
                    <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
                </div>
                <div class="bracket-actions">
                    <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
                    <button id="randomBtn" type="button" class="btn btn-ghost">Select for me</button>
                    <button id="deselectBtn" type="button" class="btn btn-ghost">Deselect all</button>
                    <button id="exportBtn" type="button" class="btn btn-ghost">Screenshot bracket (PNG)</button>
                    <button id="saveBtn" type="button" class="btn btn-primary">Save bracket</button>
                </div>
            </div>

            <div class="panel-header">
                <h2>Group Stage</h2>
                <p>Tap teams to rank them 1st–4th. Your top 2 in each group advance.</p>
            </div>

            <div id="bracket"></div>
        </div>
    </main>

    <!-- Floating feedback / bug affordance (bottom-right, global so it shows on the sign-in screen too) -->
    <a id="feedbackLink" class="feedback-fab" href="mailto:feedback@kobexamoh.me?subject=WC%20Bracket%20Pool%20feedback" title="Report a bug or send feedback">Report a bug</a>

    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
